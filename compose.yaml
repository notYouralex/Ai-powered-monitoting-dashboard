services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-monitoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  fastapi-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-monitoring}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgresql:5432/${POSTGRES_DB:-monitoring}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
      SESSION_REFRESH_SECONDS: ${SESSION_REFRESH_SECONDS:-60}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WAZUH_BASE_URL: ${WAZUH_BASE_URL:-}
      WAZUH_USERNAME: ${WAZUH_USERNAME:-}
      WAZUH_PASSWORD: ${WAZUH_PASSWORD:-}
      WAZUH_VERIFY_TLS: ${WAZUH_VERIFY_TLS:-true}
      WAZUH_CA_BUNDLE: ${WAZUH_CA_BUNDLE:-}
      WAZUH_TIMEOUT_SECONDS: ${WAZUH_TIMEOUT_SECONDS:-10}
      ZABBIX_BASE_URL: ${ZABBIX_BASE_URL:-}
      ZABBIX_API_TOKEN: ${ZABBIX_API_TOKEN:-}
      ZABBIX_VERIFY_TLS: ${ZABBIX_VERIFY_TLS:-true}
      ZABBIX_CA_BUNDLE: ${ZABBIX_CA_BUNDLE:-}
      ZABBIX_TIMEOUT_SECONDS: ${ZABBIX_TIMEOUT_SECONDS:-10}
      SNIPE_IT_BASE_URL: ${SNIPE_IT_BASE_URL:-}
      SNIPE_IT_API_TOKEN: ${SNIPE_IT_API_TOKEN:-}
      SNIPE_IT_VERIFY_TLS: ${SNIPE_IT_VERIFY_TLS:-true}
      SNIPE_IT_CA_BUNDLE: ${SNIPE_IT_CA_BUNDLE:-}
      SNIPE_IT_TIMEOUT_SECONDS: ${SNIPE_IT_TIMEOUT_SECONDS:-10}
      FRESHSERVICE_BASE_URL: ${FRESHSERVICE_BASE_URL:-}
      FRESHSERVICE_API_KEY: ${FRESHSERVICE_API_KEY:-}
      FRESHSERVICE_VERIFY_TLS: ${FRESHSERVICE_VERIFY_TLS:-true}
      FRESHSERVICE_CA_BUNDLE: ${FRESHSERVICE_CA_BUNDLE:-}
      FRESHSERVICE_TIMEOUT_SECONDS: ${FRESHSERVICE_TIMEOUT_SECONDS:-10}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
